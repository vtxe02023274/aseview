<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aseview</title>
    <style>
      :root {
        --bg: #14171f;
        --panel: #1c2029;
        --line: #2c3242;
        --text: #e6e6e6;
        --muted: #9aa3b2;
        --accent: #ffe08a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      body {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 6px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      button,
      select,
      input[type='number'],
      .file {
        background: #262b36;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
        cursor: pointer;
      }
      input[type='number'] {
        width: 56px;
      }
      .file input {
        display: none;
      }
      #info {
        white-space: pre;
        font-family: monospace;
        color: var(--muted);
      }
      .layer {
        display: block;
        padding: 2px 0;
      }
      .note {
        color: var(--muted);
      }
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .stage {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 16px;
        overflow: auto;
        background: repeating-conic-gradient(#1e222c 0 25%, #191c25 0 50%) 0 0 / 16px 16px;
      }
      #view {
        image-rendering: pixelated;
        max-width: 100%;
      }
      #frames {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      .frame {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 4px;
      }
      .frame canvas {
        image-rendering: pixelated;
      }
      .frame.current {
        border-color: var(--accent);
      }
      #message {
        color: #ff8f8f;
      }
      @media (max-width: 700px) {
        body {
          grid-template-columns: 1fr;
        }
        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>aseview</h1>
      <div class="row">
        <label class="file"
          >Open .aseprite<input id="file" type="file" accept=".ase,.aseprite"
        /></label>
        <button id="demo">Demo</button>
        <button id="stack-demo">Stack demo</button>
      </div>
      <div id="message"></div>
      <section>
        <h2>Sprite</h2>
        <div id="info"></div>
      </section>
      <section>
        <h2>Playback</h2>
        <div class="row">
          <button id="play">Play</button>
          <select id="tag"></select>
        </div>
        <label class="row" style="margin-top: 6px">
          zoom <input id="zoom" type="range" min="1" max="16" value="8" />
        </label>
      </section>
      <section>
        <h2>2.5D stack</h2>
        <div class="row">
          <select id="stack">
            <option value="off">Off</option>
            <option value="layers">Layers as slices</option>
            <option value="frames">Frames as slices</option>
          </select>
          <label><input id="spin" type="checkbox" checked /> spin</label>
        </div>
        <label class="row" style="margin-top: 6px">
          slice height <input id="spacing" type="range" min="1" max="6" value="2" />
        </label>
        <p class="note">Drag the sprite to turn it. Slices go bottom to top.</p>
      </section>
      <section>
        <h2>Layers</h2>
        <div id="layers"></div>
      </section>
      <section>
        <h2>Export</h2>
        <div class="row">
          <button id="export-frame">Frame .png</button>
          <button id="export-gif">Animation .gif</button>
        </div>
        <div class="row" style="margin-top: 6px">
          <button id="export-sheet">Sheet .png + .json</button>
          columns <input id="columns" type="number" min="1" value="8" />
        </div>
      </section>
      <p class="note">
        Files are read in your browser and never uploaded. Drop a file anywhere on the page to open
        it.
      </p>
    </aside>
    <main>
      <div class="stage"><canvas id="view"></canvas></div>
      <div id="frames"></div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
